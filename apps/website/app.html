    <section class="app-process page-width" id="how">
      <div class="process-loop" aria-label="生活长出英文，英文表达生活">
        <div class="loop-node loop-life"><strong>生活</strong></div>
        <span class="loop-relation loop-grow">长出</span>
        <svg class="loop-arrows" viewBox="0 0 800 260" aria-hidden="true">
          <defs>
            <path id="oio-loop-grow" d="M205 130C205 60 595 60 595 130"/>
            <path id="oio-loop-express" d="M595 130C595 200 205 200 205 130"/>
          </defs>
          <path class="loop-track" d="M205 130C205 60 595 60 595 130C595 200 205 200 205 130Z"/>
          <g class="loop-token loop-token-life">
            <rect x="-11" y="-8" width="22" height="16" rx="3"/>
            <path d="M-6-3h12M-6 2h8"/>
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.6s" repeatCount="indefinite"/>
            <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto"><mpath href="#oio-loop-grow"/></animateMotion>
          </g>
          <g class="loop-token loop-token-language">
            <rect x="-11" y="-8" width="22" height="16" rx="3"/>
            <path d="M-6-3h12M-6 2h8"/>
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.6s" repeatCount="indefinite"/>
            <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto"><mpath href="#oio-loop-express"/></animateMotion>
          </g>
        </svg>
        <span class="loop-relation loop-express">表达</span>
        <div class="loop-node loop-language"><strong>英文</strong></div>
      </div>
      <article class="app-process-row">
        <div class="app-process-copy"><h2>捕捉生活</h2><p>中、英，或混合，随时捕捉。</p></div>
        <figure class="screen-card"><img src="assets/app/process/capture.png" alt="从照片或文字捕捉生活，再形成英文记录"></figure>
      </article>

      <article class="app-process-row">

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    if (location.hash === '#how') {
      history.replaceState(null, '', location.pathname + location.search);
    }
    window.addEventListener('pageshow', () => window.scrollTo(0, 0));
    var groupDialog = document.getElementById('group-dialog');
    document.addEventListener('click', function (event) { if (event.target.closest('[data-join-group]')) groupDialog.showModal(); });
    groupDialog.querySelector('.dialog-close').addEventListener('click', function () { groupDialog.close(); });
    groupDialog.addEventListener('click', function (event) { if (event.target === groupDialog) groupDialog.close(); });
